apiVersion: apps/v1
kind: Deployment
metadata:
  name: devsecops-mini
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devsecops-mini
  template:
    metadata:
      labels:
        app: devsecops-mini
    spec:
      containers:
        - name: devsecops-mini
          image: hijazi112/devsecops-mini:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
            
          livenessProbe:
            httpGet:
              path: /ping
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /ping
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
