name: DevSecOps CI/CD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  tests:
    runs-on: [self-hosted, linux, x64, ubuntu]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build test image
        run: docker build -f Dockerfile.test -t devsecops-mini-test .

      - name: Run tests inside Docker
        run: docker run --rm devsecops-mini-test

  bandit:
    runs-on: [self-hosted, linux, x64, ubuntu]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit
        run: bandit -r app

  pip-audit:
    runs-on: [self-hosted, linux, x64, ubuntu]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run pip-audit
        run: pip-audit -r app/requirements.txt

  trivy:
    runs-on: [self-hosted, linux, x64, ubuntu]
    needs: [tests]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image for scan
        run: docker build -t devsecops-mini:scan .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: devsecops-mini:scan
          scan-type: image
          severity: HIGH,CRITICAL
          ignore-unfixed: true

  docker-build-push:
    runs-on: [self-hosted, linux, x64, ubuntu]
    needs: [tests, bandit, pip-audit, trivy]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push application image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/devsecops-mini:latest

  deploy:
    runs-on: [self-hosted, linux, x64, ubuntu]
    needs: [docker-build-push]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy Kubernetes manifests
        run: |
          kubectl apply -f deployment.yaml
          kubectl apply -f service.yaml

      - name: Restart deployment to pull latest image
        run: kubectl rollout restart deployment/devsecops-mini

      - name: Wait for rollout to finish
        run: kubectl rollout status deployment/devsecops-mini --timeout=120s

      - name: Show resources
        run: |
          kubectl get deployments
          kubectl get pods
          kubectl get svc
